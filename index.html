  <script id="local-preview-bootstrap">
    (function () {
      var host = location.hostname.toLowerCase();
      var octets = host.split('.').map(Number);
      var ipv4 = octets.length === 4 && octets.every(function (n) {
        return Number.isInteger(n) && n >= 0 && n <= 255;
      });
      var localHost = host === 'localhost' || host.endsWith('.localhost') ||
        host === '[::1]' || host === '::1' || host === '0.0.0.0' ||
        (ipv4 && (octets[0] === 127 || octets[0] === 10 ||
          (octets[0] === 192 && octets[1] === 168) ||
          (octets[0] === 172 && octets[1] >= 16 && octets[1] <= 31)));
      window.__YPFK_LOCAL_PREVIEW__ = localHost ||
        location.protocol === 'file:' || location.protocol === 'content:' ||
        host === 'appassets.androidplatform.net';
      if (!window.__YPFK_LOCAL_PREVIEW__) return;

      var base = document.querySelector('base');
      var entryFile = /\/(?:index|ABRIR_AQUI)\.html$/i.test(location.pathname);
      var root = new URL(base.getAttribute('href'), location.href);
      var saved = null;
      try { saved = sessionStorage.getItem('ypfk-local-base'); } catch (_) {}
      if (entryFile || location.pathname.endsWith('/')) {
        root = new URL('.', location.href);
      } else if (saved && location.pathname.startsWith(saved)) {
        root = new URL(saved, location.href);
      }
      base.href = root.href;
      try { sessionStorage.setItem('ypfk-local-base', root.pathname); } catch (_) {}
      // Avoid an old worker serving the previous installation screen locally.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          registrations.forEach(function (registration) {
            if (registration.scope === root.href) registration.unregister();
          });
        }).catch(function () {});
      }
    }());
  </script>

  <script>
    if (window.opener && new URLSearchParams(location.search).has("auth")) {
      const params = new URLSearchParams(location.search);

      window.opener.postMessage({
        auth: params.get('auth') || '',
        email: params.get('email') || '',
        error: params.get('error') || '',
        pending: params.get('pending') || '',
      }, location.origin);

      window.close();
    }

    function updateThemeColor() {
      var url = location.pathname.toLowerCase();
      var color = '#790699';

      if (url.includes('bcp')) color = '#002A8E';
      else if (url.includes('ibk')) color = '#05BE50';
      else if (url.includes('bbva')) color = '#001391';
      else if (url.includes('voucher')) color = '#660185';
      else if (url !== '/') color = '#790699';

      var meta = document.getElementById('theme-meta');
      if (meta) {
        meta.removeAttribute('content');
        meta.setAttribute('content', color);
      }
      document.documentElement.style.backgroundColor = color;
    }

    updateThemeColor();

    window.addEventListener('DOMContentLoaded', updateThemeColor);
  </script>
